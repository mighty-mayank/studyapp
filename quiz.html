<!DOCTYPE html>
<html lang="en">
<head>
  <script src="javascript/auth.js"></script>
  <meta charset="UTF-8">
  <title>Quiz Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

<iframe id="quizIframe" src=""></iframe>

<script>
  const links = {
    mathquiz1: "https://forms.gle/8rq4MQPbSpSVYXZbA",
    mathquiz2: "https://www.startpage.com/",
    socialquiz: "https://search.brave.com/",
    engquiz: "https://docs.google.com/forms/d/e/abc123/viewform"
    // Add more here...
  };

  const urlParams = new URLSearchParams(window.location.search);
  const fileName = urlParams.get('file');

  if (fileName && links[fileName]) {
    document.getElementById("quizIframe").src = links[fileName];
  } else {
    document.body.innerHTML = "<p style='text-align:center;'>Invalid or missing quiz link.</p>";
  }
</script>

</body>
</html>
